<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CartZen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="contact">
    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Get in touch with the CartZen team.</p>

        <div class="contact-content">

            <div class="contact-info">
                <h3>Our Information</h3>
                <p><strong>📍 Address:</strong> Latur, Maharashtra, India</p>
                <p><strong>📞 Phone:</strong> +91 98765 43210</p>
                <p><strong>✉ Email:</strong> support@cartzen.com</p>
                <p><strong>🕒 Working Hours:</strong> Mon - Sat, 9 AM - 6 PM</p>
            </div>

            <div class="contact-form">
                <form>
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <input type="text" placeholder="Subject" required>
                    <textarea rows="5" placeholder="Your Message" required></textarea>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>

        </div>
    </div>
</section>

</body>
</html>
